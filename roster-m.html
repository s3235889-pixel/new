<!DOCTYPE html>
<html lang="zh-TW" style="--zoom: 1;">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>連鎖排班系統｜手機雲端版</title>

  <!-- 引入 Supabase 與截圖工具 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

  <style>
    :root {
      --zoom: 1;
      --cell-w: 78px;
      --cell-h: 38px;
      --font-s: 13px;
      --left-w: 92px;
      --right-w: 44px;
      --del-w: 36px;

      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-soft: #f8fafb;
      --line: #e2e8f0;
      --line-strong: #cbd5e1;
      --text: #1e293b;
      --muted: #64748b;
      --accent: #475569;
      --accent-hover: #334155;
      --accent-soft: #f1f5f9;
      --primary: #3b82f6;
      --danger: #ef4444;
      --danger-soft: #fef2f2;
      --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { min-height: 100%; margin: 0; padding: 0; background: var(--bg); color: var(--text); }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
      padding-bottom: calc(75px + env(safe-area-inset-bottom));
      user-select: none;
      -webkit-user-select: none;
    }

    /* 頂部導覽列 */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .month-stepper {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .month-title {
      margin: 0;
      font-size: 17px;
      font-weight: 800;
      color: #0f172a;
      min-width: 105px;
      text-align: center;
    }

    .btn {
      height: 38px;
      border: 1px solid var(--line-strong);
      background: #fff;
      color: var(--text);
      border-radius: 10px;
      padding: 0 12px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: 0.15s ease;
    }

    .btn:active { transform: scale(0.96); }
    .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-soft { background: var(--accent-soft); border-color: transparent; color: var(--muted); }
    .btn-icon { width: 36px; padding: 0; font-size: 16px; }

    /* 門市資訊徽章 */
    .branch-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 800;
      padding: 6px 10px;
      background: #e0f2fe;
      color: #0369a1;
      border-radius: 8px;
      cursor: pointer;
    }

    /* 縮放與控制工具列 */
    .control-card {
      background: #fff;
      border-bottom: 1px solid var(--line);
      padding: 8px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .slider-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .slider-item {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      flex: 1 1 140px;
    }

    .slider-item input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      min-width: 60px;
    }

    .slider-val {
      min-width: 38px;
      text-align: right;
      color: var(--text);
    }

    .quick-zoom-btns {
      display: flex;
      gap: 6px;
    }

    .btn-xs {
      height: 28px;
      font-size: 11px;
      padding: 0 8px;
      border-radius: 6px;
    }

    /* 排班表格 */
    #tableView {
      padding: 10px 8px;
    }

    .table-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .table-container {
      overflow-x: auto;
      overflow-y: auto;
      max-height: 68vh;
      -webkit-overflow-scrolling: touch;
      position: relative;
    }

    table {
      border-collapse: separate;
      border-spacing: 0;
      width: max-content;
      table-layout: fixed;
      background: #fff;
    }

    th, td {
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      text-align: center;
      padding: 0;
      width: calc(var(--cell-w) * var(--zoom));
      min-width: calc(var(--cell-w) * var(--zoom));
      max-width: calc(var(--cell-w) * var(--zoom));
      height: calc(var(--cell-h) * var(--zoom));
      font-size: calc(var(--font-s) * var(--zoom));
      color: var(--text);
      white-space: nowrap;
      box-sizing: border-box;
    }

    thead { position: sticky; top: 0; z-index: 40; }
    th { background: #f8fafc; color: var(--muted); font-weight: 800; }
    #dateRow th { height: calc(38px * var(--zoom)); color: #334155; }
    #dayRow th { font-size: calc(11px * var(--zoom)); }

    /* 放大左側姓名首欄字體 */
    td:first-child, th:first-child {
      position: sticky;
      left: 0;
      background: #f1f5f9;
      z-index: 50;
      border-right: 2px solid var(--line-strong);
      width: calc(var(--left-w) * var(--zoom)) !important;
      min-width: calc(var(--left-w) * var(--zoom)) !important;
      max-width: calc(var(--left-w) * var(--zoom)) !important;
      font-weight: 900;
      font-size: calc(var(--font-s) * var(--zoom) * 1.25);
      letter-spacing: 0.03em;
    }

    .stat-cell {
      position: sticky;
      right: calc((var(--left-w) + var(--del-w)) * var(--zoom));
      background: #f8fafc !important;
      z-index: 45;
      border-left: 2px solid var(--line-strong);
      font-weight: 800;
      color: var(--muted) !important;
      width: calc(var(--right-w) * var(--zoom)) !important;
      min-width: calc(var(--right-w) * var(--zoom)) !important;
    }

    /* 放大右側姓名欄字體 */
    .right-name-cell {
      position: sticky;
      right: calc(var(--del-w) * var(--zoom));
      background: #f1f5f9 !important;
      z-index: 50;
      border-left: 2px solid var(--line-strong);
      width: calc(var(--left-w) * var(--zoom)) !important;
      min-width: calc(var(--left-w) * var(--zoom)) !important;
      font-weight: 900;
      font-size: calc(var(--font-s) * var(--zoom) * 1.25);
      letter-spacing: 0.03em;
      padding: 0 4px;
    }

    .right-del-cell {
      position: sticky;
      right: 0;
      background: var(--danger-soft) !important;
      z-index: 50;
      border-left: 1px solid #fecaca;
      width: calc(var(--del-w) * var(--zoom)) !important;
      min-width: calc(var(--del-w) * var(--zoom)) !important;
      color: var(--danger);
      font-weight: 800;
      font-size: calc(var(--font-s) * var(--zoom) * 1.2);
      cursor: pointer;
    }

    select {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
      -webkit-appearance: none;
      appearance: none;
      text-align: center;
      text-align-last: center;
      font-weight: 750;
      color: var(--text) !important;
      padding: 0 1px;
      font-size: inherit;
      outline: none;
    }

    /* 底部導覽列 */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(58px + env(safe-area-inset-bottom));
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding-bottom: env(safe-area-inset-bottom);
      z-index: 90;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      background: none;
      border: none;
      padding: 6px;
      cursor: pointer;
      flex: 1;
    }

    .nav-item-icon { font-size: 18px; line-height: 1; }
    .nav-item:active { color: var(--primary); }

    /* 彈窗與登入遮罩 */
    .modal {
      display: none;
      position: fixed;
      z-index: 3000;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      justify-content: center;
      align-items: center;
      padding: 16px;
      backdrop-filter: blur(6px);
    }

    .modal-content {
      background: #fff;
      padding: 20px;
      border-radius: 20px;
      width: min(440px, 100%);
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      max-height: 85vh;
      overflow-y: auto;
    }

    .auth-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(10px);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .auth-card {
      background: #fff;
      padding: 24px 20px;
      border-radius: 20px;
      width: min(340px, 100%);
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
      text-align: center;
    }

    .auth-input {
      width: 100%;
      height: 44px;
      border: 1.5px solid var(--line-strong);
      border-radius: 10px;
      padding: 0 12px;
      margin: 10px 0 14px;
      font-size: 16px;
      text-align: center;
      font-weight: 700;
      outline: none;
    }

    .shift-list {
      margin-top: 12px;
      max-height: 260px;
      overflow-y: auto;
      border: 1px solid var(--line);
      padding: 6px;
      border-radius: 12px;
      background: var(--bg);
    }

    .shift-item {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr) 32px 40px 24px;
      align-items: center;
      gap: 6px;
      padding: 6px;
      margin-top: 4px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
    }

    .admin-branch-row {
      display: grid;
      grid-template-columns: 75px 1fr 60px;
      gap: 6px;
      align-items: center;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
    }
  </style>
</head>

<body>
  <!-- 門市驗證層 -->
  <div id="authOverlay" class="auth-overlay">
    <div class="auth-card">
      <h2 style="margin:0 0 4px; font-size:19px; color:#0f172a;">門市排班登入</h2>
      <p style="margin:0 0 14px; font-size:12px; color:var(--muted);">請選擇分店並輸入專屬密碼</p>
      
      <select id="authBranchSelect" style="width:100%; height:44px; border:1.5px solid var(--line-strong); border-radius:10px; padding:0 8px; font-weight:bold; font-size:14px; margin-bottom:8px;"></select>
      <input type="password" id="authPassword" class="auth-input" placeholder="分店密碼 / 超級密碼" />
      
      <button class="btn btn-primary" style="width:100%; height:44px; font-size:15px;" onclick="verifyBranchLogin()">登入排班表</button>
      <div id="authError" style="color:var(--danger); font-size:12px; font-weight:bold; margin-top:8px; display:none;">密碼錯誤，請重新輸入</div>

      <div style="margin-top:14px; border-top:1px solid var(--line); padding-top:10px;">
        <button class="btn btn-soft" style="width:100%; font-size:12px;" onclick="promptSuperAdmin()">🛠 超級管理者控制台</button>
      </div>
    </div>
  </div>

  <!-- 頂部月份與門市徽章 -->
  <div class="topbar">
    <div class="month-stepper">
      <button class="btn btn-soft btn-icon" onclick="changeMonth(-1)">‹</button>
      <h2 id="currentMonthDisplay" class="month-title">載入中...</h2>
      <button class="btn btn-soft btn-icon" onclick="changeMonth(1)">›</button>
    </div>

    <div id="currentBranchBadge" class="branch-badge" onclick="showSwitchBranchModal()">
      🏪 <span id="currentBranchLabel">-</span>
    </div>
  </div>

  <!-- 縮放與控制工具列 -->
  <div class="control-card">
    <div class="slider-row">
      <div class="slider-item">
        <span>縮放</span>
        <input type="range" id="zoomSlider" min="0.3" max="1.3" step="0.05" value="1" oninput="updateZoom(this.value)" />
        <span id="zoomVal" class="slider-val">100%</span>
      </div>

      <div class="quick-zoom-btns">
        <button class="btn btn-soft btn-xs" onclick="setQuickZoom(0.45)">📱 全覽 (45%)</button>
        <button class="btn btn-soft btn-xs" onclick="setQuickZoom(1.0)">🔍 預設 (100%)</button>
      </div>
    </div>

    <div class="slider-row">
      <div class="slider-item">
        <span>姓名欄</span>
        <input type="range" id="nameWidthSlider" min="50" max="160" step="2" value="92" oninput="updateNameWidth(this.value)" />
        <span id="nameWidthVal" class="slider-val">92px</span>
      </div>

      <div class="slider-item">
        <span>日期欄</span>
        <input type="range" id="cellWidthSlider" min="30" max="120" step="1" value="78" oninput="updateCellWidth(this.value)" />
        <span id="cellWidthVal" class="slider-val">78px</span>
      </div>
    </div>
  </div>

  <!-- 表格排班本體 -->
  <div id="tableView">
    <div class="table-card">
      <div id="tableContainer" class="table-container">
        <table id="rosterTable">
          <thead>
            <tr id="dateRow"></tr>
            <tr id="dayRow"></tr>
          </thead>
          <tbody id="rosterBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 底部手機導覽列 -->
  <nav class="bottom-nav">
    <button class="nav-item" onclick="addNewPerson()">
      <span class="nav-item-icon">👤</span>
      <span>新增人員</span>
    </button>
    <button class="nav-item" onclick="openModal()">
      <span class="nav-item-icon">🏷️</span>
      <span>班別設定</span>
    </button>
    <button class="nav-item" onclick="showSwitchBranchModal()">
      <span class="nav-item-icon">🏪</span>
      <span>切換分店</span>
    </button>
    <button class="nav-item" onclick="exportToImage()">
      <span class="nav-item-icon">📸</span>
      <span>匯出圖片</span>
    </button>
    <button id="adminNavBtn" class="nav-item" style="display:none;" onclick="openAdminModal()">
      <span class="nav-item-icon">⚙️</span>
      <span>管理控制台</span>
    </button>
  </nav>

  <!-- 班別設定彈窗 -->
  <div id="shiftModal" class="modal">
    <div class="modal-content">
      <h3 style="margin:0 0 4px; font-size:17px;">班別設定</h3>
      <p style="margin:0 0 12px; font-size:12px; color:var(--muted);">新增或修改班別、顏色與休假計算規則。</p>

      <div style="display:grid; grid-template-columns: 1fr 44px 44px; gap:6px; margin-bottom:8px; align-items:center;">
        <input type="text" id="newShiftLabel" placeholder="名稱，如：早班" style="height:40px; border:1px solid var(--line-strong); border-radius:8px; padding:0 8px; font-weight:bold;" />
        <input type="color" id="newShiftBgColor" value="#e8eef1" style="height:40px; width:44px; border:1px solid var(--line); border-radius:8px; padding:2px;" />
        <label style="font-size:12px; font-weight:bold; display:flex; align-items:center; justify-content:center; gap:2px;">
          <input type="checkbox" id="newShiftIsOff"> 休
        </label>
      </div>

      <button class="btn btn-primary" style="width:100%; height:40px;" onclick="addNewShift()">新增班別</button>
      <div id="existingShiftsList" class="shift-list"></div>
      <button class="btn btn-soft" style="width:100%; height:40px; margin-top:12px;" onclick="closeModal()">完成</button>
    </div>
  </div>

  <!-- 超級管理者控制台彈窗 -->
  <div id="adminModal" class="modal">
    <div class="modal-content">
      <h3 style="margin:0 0 4px; font-size:17px;">🛠 超級管理者控制台</h3>
      <p style="margin:0 0 12px; font-size:12px; color:var(--muted);">管理 6 間門市登入密碼與超級管理者金鑰。</p>

      <div style="background:var(--bg); padding:10px; border-radius:10px; margin-bottom:12px;">
        <div style="font-size:12px; font-weight:bold; margin-bottom:4px;">修改超級密碼：</div>
        <div style="display:flex; gap:6px;">
          <input type="text" id="superAdminNewPwd" style="flex:1; height:36px; border:1px solid var(--line-strong); border-radius:8px; padding:0 8px;" />
          <button class="btn btn-primary" style="height:36px;" onclick="saveSuperAdminPassword()">更新</button>
        </div>
      </div>

      <div style="font-size:12px; font-weight:bold; margin-bottom:6px;">各分店登入密碼：</div>
      <div id="adminBranchList"></div>

      <button class="btn btn-soft" style="width:100%; height:40px; margin-top:14px;" onclick="closeModal()">關閉</button>
    </div>
  </div>

<script>
  // ==========================================
  // 1. SUPABASE 配置
  // ==========================================
  const SUPABASE_URL = 'https://xgsoumyjrasuopprrfzy.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_Uj1xHvGTdIVK8KVAcd5Q8A_M9uShHfo';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentYear = 2026;
  let currentMonth = 8;

  let branchList = [];
  let currentBranch = null;
  let isSuperAdmin = false;
  let superAdminPwd = 'admin888';
  let staffList = [];
  let shiftTypes = [];
  let currentRecords = {};
  let settings = { name_width: 92, cell_width: 78, zoom: 1.0 };

  async function init() {
    await loadSuperAdminConfig();
    await loadBranches();
  }

  // ==========================================
  // 超級管理與門市驗證
  // ==========================================
  async function loadSuperAdminConfig() {
    try {
      const { data } = await db.from('admin_config').select('value').eq('key', 'super_admin_password').single();
      if (data && data.value) superAdminPwd = data.value;
    } catch (e) {}
  }

  async function loadBranches() {
    const { data } = await db.from('branches').select('*').order('sort_order', { ascending: true });
    branchList = data || [];
    const select = document.getElementById('authBranchSelect');
    select.innerHTML = branchList.map(b => `<option value="${b.id}">${escapeHtml(b.name)}</option>`).join('');
  }

  async function verifyBranchLogin() {
    const branchId = document.getElementById('authBranchSelect').value;
    const inputPwd = document.getElementById('authPassword').value.trim();
    const targetBranch = branchList.find(b => String(b.id) === String(branchId));

    await loadSuperAdminConfig();

    if (inputPwd === superAdminPwd || (targetBranch && String(targetBranch.password) === String(inputPwd))) {
      if (inputPwd === superAdminPwd) {
        isSuperAdmin = true;
        document.getElementById('adminNavBtn').style.display = 'flex';
      }

      currentBranch = targetBranch;
      document.getElementById('currentBranchLabel').innerText = currentBranch.name;
      document.getElementById('authOverlay').style.display = 'none';
      document.getElementById('authError').style.display = 'none';
      document.getElementById('authPassword').value = '';

      await loadSettings();
      await loadShiftTypes();
      await loadBranchStaff();
      await loadMonthRecords();

      applyUI();
      renderCalendar();
    } else {
      document.getElementById('authError').style.display = 'block';
    }
  }

  async function promptSuperAdmin() {
    await loadSuperAdminConfig();
    const pwd = prompt('請輸入超級管理者密碼：');
    if (pwd === null) return;

    if (pwd.trim() === superAdminPwd) {
      isSuperAdmin = true;
      document.getElementById('adminNavBtn').style.display = 'flex';
      openAdminModal();
    } else {
      alert('密碼錯誤！');
    }
  }

  function openAdminModal() {
    document.getElementById('superAdminNewPwd').value = superAdminPwd;
    renderAdminBranchList();
    document.getElementById('adminModal').style.display = 'flex';
  }

  function renderAdminBranchList() {
    const container = document.getElementById('adminBranchList');
    container.innerHTML = '';
    branchList.forEach((b) => {
      const row = document.createElement('div');
      row.className = 'admin-branch-row';
      row.innerHTML = `
        <span style="font-weight:bold; font-size:13px;">${escapeHtml(b.name)}</span>
        <input type="text" id="branchPwd_${b.id}" style="height:32px; border:1px solid var(--line-strong); border-radius:6px; padding:0 6px;" value="${escapeHtml(b.password)}" />
        <button class="btn btn-primary" style="height:32px; font-size:11px; padding:0 8px;" onclick="saveBranchPassword('${b.id}')">儲存</button>
      `;
      container.appendChild(row);
    });
  }

  async function saveBranchPassword(branchId) {
    const newPwd = document.getElementById(`branchPwd_${branchId}`).value.trim();
    if (!newPwd) return alert('密碼不能為空');
    const { error } = await db.from('branches').update({ password: newPwd }).eq('id', branchId);
    if (!error) {
      const b = branchList.find(item => item.id === branchId);
      if (b) b.password = newPwd;
      alert('分店密碼更新成功！');
    }
  }

  async function saveSuperAdminPassword() {
    const newPwd = document.getElementById('superAdminNewPwd').value.trim();
    if (!newPwd) return alert('超級密碼不能為空');
    const { error } = await db.from('admin_config').upsert({
      key: 'super_admin_password',
      value: newPwd,
      updated_at: new Date().toISOString()
    });
    if (!error) {
      superAdminPwd = newPwd;
      alert('超級密碼更新成功！');
    }
  }

  function showSwitchBranchModal() {
    document.getElementById('authOverlay').style.display = 'flex';
  }

  // ==========================================
  // 介面設定 (縮放與欄寬)
  // ==========================================
  async function loadSettings() {
    try {
      const { data } = await db.from('user_settings').select('*').eq('key', 'default_config').single();
      if (data) settings = data;
    } catch (e) {}
  }

  async function syncSettingsToDB() {
    await db.from('user_settings').upsert({
      key: 'default_config',
      name_width: settings.name_width,
      cell_width: settings.cell_width,
      zoom: settings.zoom,
      updated_at: new Date().toISOString()
    });
  }

  function applyUI() {
    document.documentElement.style.setProperty('--zoom', settings.zoom);
    document.documentElement.style.setProperty('--left-w', settings.name_width + 'px');
    document.documentElement.style.setProperty('--cell-w', settings.cell_width + 'px');

    document.getElementById('zoomSlider').value = settings.zoom;
    document.getElementById('zoomVal').innerText = Math.round(settings.zoom * 100) + '%';
    document.getElementById('nameWidthSlider').value = settings.name_width;
    document.getElementById('nameWidthVal').innerText = settings.name_width + 'px';
    document.getElementById('cellWidthSlider').value = settings.cell_width;
    document.getElementById('cellWidthVal').innerText = settings.cell_width + 'px';
  }

  function updateZoom(v) {
    settings.zoom = parseFloat(v);
    document.documentElement.style.setProperty('--zoom', settings.zoom);
    document.getElementById('zoomVal').innerText = Math.round(settings.zoom * 100) + '%';
    syncSettingsToDB();
  }

  function setQuickZoom(val) {
    settings.zoom = val;
    document.documentElement.style.setProperty('--zoom', settings.zoom);
    document.getElementById('zoomSlider').value = settings.zoom;
    document.getElementById('zoomVal').innerText = Math.round(settings.zoom * 100) + '%';
    syncSettingsToDB();
  }

  function updateNameWidth(v) {
    settings.name_width = parseInt(v);
    document.documentElement.style.setProperty('--left-w', settings.name_width + 'px');
    document.getElementById('nameWidthVal').innerText = settings.name_width + 'px';
    syncSettingsToDB();
  }

  function updateCellWidth(v) {
    settings.cell_width = parseInt(v);
    document.documentElement.style.setProperty('--cell-w', settings.cell_width + 'px');
    document.getElementById('cellWidthVal').innerText = settings.cell_width + 'px';
    syncSettingsToDB();
  }

  // ==========================================
  // 班別與人員資料
  // ==========================================
  async function loadShiftTypes() {
    const { data } = await db.from('shift_types').select('*').order('sort_order', { ascending: true });
    const rawList = (data || []).filter(s => s.code && s.code.trim() !== '');
    shiftTypes = [
      { id: 'blank-default', code: '', label: '', bg_color: '#ffffff', is_off: false, sort_order: -999 },
      ...rawList
    ];
  }

  async function addNewShift() {
    const label = document.getElementById('newShiftLabel').value.trim();
    const color = document.getElementById('newShiftBgColor').value;
    const isOff = document.getElementById('newShiftIsOff').checked;

    if (!label) return alert('請輸入名稱');
    const code = 'custom_' + Date.now();
    const nextOrder = shiftTypes.length;

    const { data, error } = await db.from('shift_types').insert({
      code, label, bg_color: color, is_off: isOff, sort_order: nextOrder
    }).select().single();

    if (!error && data) {
      shiftTypes.push(data);
      document.getElementById('newShiftLabel').value = '';
      document.getElementById('newShiftIsOff').checked = false;
      renderShiftList();
      renderCalendar();
    }
  }

  function renderShiftList() {
    const list = document.getElementById('existingShiftsList');
    list.innerHTML = '';
    shiftTypes.forEach((shift, i) => {
      if (shift.code === '') return;
      const div = document.createElement('div');
      div.className = 'shift-item';
      div.style.borderLeft = `3px solid ${shift.bg_color}`;
      div.innerHTML = `
        <span style="color:var(--muted); font-size:12px;">☰</span>
        <input type="text" style="height:28px; border:1px solid var(--line); border-radius:6px; padding:0 4px; font-size:12px; font-weight:bold;" value="${escapeHtml(shift.label)}" onchange="editShift(${i}, 'label', this.value)" />
        <input type="color" style="height:28px; width:28px; border:none; border-radius:4px; padding:0;" value="${shift.bg_color}" onchange="editShift(${i}, 'bg_color', this.value)" />
        <label style="font-size:11px; font-weight:bold;"><input type="checkbox" ${shift.is_off ? 'checked' : ''} onchange="editShift(${i}, 'is_off', this.checked)"> 休</label>
        <span style="color:var(--danger); font-weight:bold; cursor:pointer;" onclick="deleteShift(${i})">×</span>
      `;
      list.appendChild(div);
    });
  }

  async function editShift(index, field, value) {
    const target = shiftTypes[index];
    if (!target || !target.code) return;
    target[field] = value;
    await db.from('shift_types').update({ [field]: value }).eq('id', target.id);
    renderCalendar();
  }

  async function deleteShift(index) {
    const target = shiftTypes[index];
    if (!target || !confirm(`確定刪除「${target.label}」？`)) return;
    await db.from('shift_types').delete().eq('id', target.id);
    shiftTypes.splice(index, 1);
    renderShiftList();
    renderCalendar();
  }

  async function loadBranchStaff() {
    if (!currentBranch) return;
    const { data } = await db.from('staff')
      .select('*')
      .eq('branch_id', currentBranch.id)
      .order('sort_order', { ascending: true });
    staffList = data || [];
  }

  async function addNewPerson() {
    if (!currentBranch) return;
    const name = prompt(`輸入【${currentBranch.name}】新進人員姓名`);
    if (!name || !name.trim()) return;

    const { data, error } = await db.from('staff').insert({
      name: name.trim(),
      branch_id: currentBranch.id,
      sort_order: staffList.length
    }).select().single();

    if (error) return alert('新增失敗或人員已存在');
    staffList.push(data);
    renderCalendar();
  }

  async function deletePerson(staffId, staffName) {
    if (!confirm(`確定從【${currentBranch.name}】刪除「${staffName}」？`)) return;
    await db.from('staff').delete().eq('id', staffId);
    staffList = staffList.filter(s => s.id !== staffId);
    delete currentRecords[staffId];
    renderCalendar();
  }

  // ==========================================
  // 排班明細存取與月曆渲染
  // ==========================================
  function getDateStr(day) {
    return `${currentYear}-${String(currentMonth).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
  }

  async function loadMonthRecords() {
    const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();
    const startDate = getDateStr(1);
    const endDate = getDateStr(daysInMonth);
    const staffIds = staffList.map(s => s.id);

    if (staffIds.length === 0) { currentRecords = {}; return; }

    const { data } = await db.from('roster_records')
      .select('*')
      .in('staff_id', staffIds)
      .gte('shift_date', startDate)
      .lte('shift_date', endDate);

    currentRecords = {};
    (data || []).forEach(r => {
      if (!currentRecords[r.staff_id]) currentRecords[r.staff_id] = {};
      currentRecords[r.staff_id][r.shift_date] = r.shift_code || '';
    });
  }

  async function updateShift(staffId, day, shiftCode, selectElem) {
    const dateStr = getDateStr(day);

    if (!currentRecords[staffId]) currentRecords[staffId] = {};
    currentRecords[staffId][dateStr] = shiftCode;

    if (selectElem) applySelectStyle(selectElem, shiftCode);

    if (!shiftCode || shiftCode.trim() === '') {
      await db.from('roster_records').delete().eq('staff_id', staffId).eq('shift_date', dateStr);
    } else {
      await db.from('roster_records').upsert({
        staff_id: staffId,
        shift_date: dateStr,
        shift_code: shiftCode,
        updated_at: new Date().toISOString()
      }, { onConflict: 'staff_id,shift_date' });
    }

    renderCalendar();
  }

  function applySelectStyle(selectElem, shiftCode) {
    const shift = shiftTypes.find(s => s.code === shiftCode);
    const parent = selectElem.parentElement;
    parent.style.backgroundColor = (shift && shift.bg_color) ? shift.bg_color : '#ffffff';
  }

  function renderCalendar() {
    document.getElementById('currentMonthDisplay').innerText = `${currentYear}年 ${currentMonth}月`;

    const rosterBody = document.getElementById('rosterBody');
    const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();
    const weekDays = ['日', '一', '二', '三', '四', '五', '六'];

    let dateHtml = '<th>人員</th>';
    for (let i = 1; i <= daysInMonth; i++) dateHtml += `<th>${i}</th>`;
    dateHtml += '<th class="stat-cell">休</th><th class="right-name-cell">人員</th><th class="right-del-cell">刪</th>';
    document.getElementById('dateRow').innerHTML = dateHtml;

    let dayHtml = '<th>排序</th>';
    for (let i = 1; i <= daysInMonth; i++) {
      const day = new Date(currentYear, currentMonth - 1, i).getDay();
      const isWeekend = day === 0 || day === 6;
      dayHtml += `<th style="${isWeekend ? 'color:var(--danger);' : ''}">${weekDays[day]}</th>`;
    }
    dayHtml += '<th class="stat-cell">Σ</th><th class="right-name-cell">人員</th><th class="right-del-cell">×</th>';
    document.getElementById('dayRow').innerHTML = dayHtml;

    rosterBody.innerHTML = '';

    if (staffList.length === 0) {
      rosterBody.innerHTML = `<tr><td colspan="${daysInMonth + 4}" style="padding:20px; color:var(--muted); font-weight:bold;">此門市尚無人員名單，請點下方「新增人員」</td></tr>`;
      return;
    }

    staffList.forEach(staff => {
      const tr = document.createElement('tr');
      let html = `<td>${escapeHtml(staff.name)}</td>`;
      const staffRecord = currentRecords[staff.id] || {};

      let offCount = 0;
      for (let i = 1; i <= daysInMonth; i++) {
        const dateStr = getDateStr(i);
        const currentVal = staffRecord[dateStr] || '';
        const shiftObj = shiftTypes.find(s => s.code === currentVal);
        if (shiftObj && shiftObj.is_off) offCount++;

        html += `
          <td style="background-color: ${shiftObj ? shiftObj.bg_color : '#fff'};">
            <select onchange="updateShift('${staff.id}', ${i}, this.value, this)">
              ${shiftTypes.map(s => `
                <option value="${escapeHtml(s.code)}" ${s.code === currentVal ? 'selected' : ''}>
                  ${escapeHtml(s.label)}
                </option>
              `).join('')}
            </select>
          </td>
        `;
      }

      html += `
        <td class="stat-cell">${offCount}</td>
        <td class="right-name-cell">${escapeHtml(staff.name)}</td>
        <td class="right-del-cell" onclick="deletePerson('${staff.id}', '${escapeJsString(staff.name)}')">×</td>
      `;

      tr.innerHTML = html;
      rosterBody.appendChild(tr);
    });
  }

  // ==========================================
  // 輔助功能
  // ==========================================
  async function changeMonth(delta) {
    const d = new Date(currentYear, currentMonth - 1 + delta, 1);
    currentYear = d.getFullYear();
    currentMonth = d.getMonth() + 1;

    await loadMonthRecords();
    renderCalendar();
  }

  async function exportToImage() {
    const container = document.getElementById('tableContainer');
    const oldHeight = container.style.maxHeight;
    container.style.maxHeight = 'none';

    const canvas = await html2canvas(document.getElementById('rosterTable'), { scale: 2, backgroundColor: '#ffffff' });
    container.style.maxHeight = oldHeight;

    const link = document.createElement('a');
    link.href = canvas.toDataURL('image/png');
    link.download = `【${currentBranch ? currentBranch.name : '門市'}】_${currentYear}_${currentMonth}月.png`;
    link.click();
  }

  function openModal() {
    document.getElementById('shiftModal').style.display = 'flex';
    renderShiftList();
  }

  function closeModal() {
    document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
  }

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m]);
  }

  function escapeJsString(str) {
    return String(str || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
  }

  window.addEventListener('click', e => {
    if (e.target === document.getElementById('shiftModal') || e.target === document.getElementById('adminModal')) {
      closeModal();
    }
  });

  init();
</script>
</body>
</html>
