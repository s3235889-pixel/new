<!DOCTYPE html>
<html lang="zh-TW">
<head>

  <meta name="color-scheme" content="light" />
  <title>沖繩 7 天 6 夜自駕行程｜蛋奶素旅行規劃</title>
  <style>

    :root{
      --paper:#f6f3ec;
      --paper-2:#fbfaf6;
      --card:#fffefa;
      --ink:#292a27;
      --muted:#77756e;
      --line:#d9d3c7;
      --line-soft:#e9e4da;
      --indigo:#405268;
      --indigo-deep:#2f3c4d;
      --vermillion:#a65443;
      --moss:#65705b;
      --sand:#a68f6f;
      --gold:#b09b75;
      --warn:#8b6738;
      --danger:#8b5148;
      --sea:#e9f0f1;
      --island:#dde4d9;
      --shadow:0 8px 28px rgba(46,43,36,.055);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth;background:#e9e5dc}
    body{
      font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans TC","PingFang TC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:
        radial-gradient(circle at 10% 0%,rgba(255,255,255,.72),transparent 30%),
        linear-gradient(180deg,var(--paper-2) 0,var(--paper) 46%,#f2efe8 100%);
      color:var(--ink);max-width:780px;margin:0 auto;padding:24px 18px 34px;line-height:1.72;
      min-height:100vh;
    }
    button,input{font:inherit}
    a{color:inherit}
    button,a{-webkit-tap-highlight-color:transparent}

    header{text-align:left;padding:15px 3px 23px;border-bottom:1px solid var(--line);margin-bottom:18px;position:relative}
    header:before{content:"OKINAWA  ·  ROAD JOURNEY";display:block;color:var(--sand);font-family:Georgia,"Times New Roman",serif;font-size:.68rem;letter-spacing:.22em;margin-bottom:10px}
    header:after{content:"";position:absolute;bottom:-1px;left:3px;width:52px;height:2px;background:var(--vermillion)}
    h1{font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif TC",serif;font-size:1.7rem;font-weight:600;letter-spacing:.055em;color:var(--ink);margin-bottom:7px}
    .subtitle{font-size:.82rem;letter-spacing:.035em;color:var(--muted)}
    .updated{margin-top:10px;display:inline-flex;align-items:center;border:0;border-left:2px solid var(--gold);border-radius:0;padding:1px 0 1px 9px;font-size:.7rem;color:#8a8377;background:transparent}

    .notice{background:rgba(255,254,250,.74);border:1px solid var(--line);border-radius:3px;padding:14px 15px;margin-bottom:16px;font-size:.82rem;color:#5a554d;box-shadow:none}
    .notice strong{color:var(--ink);font-weight:700}
    .jp-card{margin-top:10px;background:#f2eee5;border:0;border-left:2px solid var(--sand);border-radius:0;padding:9px 11px;color:#625d54;display:flex;gap:9px;align-items:flex-start}
    .jp-card code{white-space:normal;font-family:"Yu Gothic","Hiragino Sans",sans-serif;font-size:.78rem;line-height:1.65;font-weight:600;color:#514d46}

    .mode-switch{display:grid;grid-template-columns:1fr 1fr;background:transparent;border:1px solid var(--line);border-radius:3px;padding:3px;margin-bottom:14px;gap:3px}
    .mode-btn{border:0;background:transparent;border-radius:1px;padding:10px 7px;font-weight:650;font-size:.83rem;letter-spacing:.025em;color:#716e67;cursor:pointer;transition:background .18s,color .18s}
    .mode-btn.active,.mode-btn.late-active{background:var(--indigo-deep);color:#fff;box-shadow:none}

    .day-bar{display:flex;gap:7px;overflow-x:auto;padding:2px 1px 11px;margin-bottom:6px;scrollbar-width:none}
    .day-bar::-webkit-scrollbar,.filter-row::-webkit-scrollbar{display:none}
    .day-btn{white-space:nowrap;border:1px solid var(--line);background:rgba(255,254,250,.72);padding:7px 11px;border-radius:2px;color:#68665f;font-weight:650;font-size:.77rem;cursor:pointer;letter-spacing:.02em}
    .day-btn.active{background:var(--ink);color:#fff;border-color:var(--ink)}

    .route-box{background:rgba(255,254,250,.82);border:1px solid var(--line);border-radius:3px;padding:14px;margin-bottom:20px;box-shadow:var(--shadow)}
    .route-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
    .route-title{font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif TC",serif;font-size:.98rem;font-weight:600;letter-spacing:.025em;color:var(--ink)}
    .play-btn{border:1px solid var(--indigo);background:transparent;color:var(--indigo-deep);font-weight:650;border-radius:2px;padding:6px 10px;font-size:.72rem;cursor:pointer;white-space:nowrap}
    .play-btn:hover{background:var(--indigo-deep);color:#fff}
    .svg-wrap{height:400px;background:var(--sea);border:1px solid #d0dadd;border-radius:2px;overflow:hidden;position:relative}
    .island{fill:var(--island);stroke:#aebbad;stroke-width:2.05}
    .route-base{fill:none;stroke:#99978f;stroke-width:4.8;stroke-dasharray:7 9}
    .route-active{fill:none;stroke:var(--vermillion);stroke-width:6.4;stroke-linecap:round}
    .stop{fill:var(--paper-2);stroke:var(--vermillion);stroke-width:4.2}
    .stop-label{font-size:13.5px;font-weight:700;fill:#393a37;paint-order:stroke;stroke:#f7f5ef;stroke-width:3.5px;stroke-linejoin:round}
    .sea-label{font-size:11.5px;font-family:Georgia,"Times New Roman",serif;letter-spacing:.08em;font-weight:600;fill:#6d8188;opacity:.7}
    #car{position:absolute;font-size:46px;transform:translate(-50%,-50%);z-index:3;filter:grayscale(.08) drop-shadow(0 3px 4px rgba(0,0,0,.22));will-change:left,top}

    .controls{position:sticky;top:0;z-index:20;background:rgba(246,243,236,.93);backdrop-filter:blur(12px);padding:8px 0 11px;border-bottom:1px solid rgba(217,211,199,.65);margin-bottom:12px}
    .search{width:100%;border:0;border-bottom:1px solid #aaa397;border-radius:0;padding:11px 2px;font-size:.86rem;background:transparent;outline:none;box-shadow:none;margin-bottom:10px;color:var(--ink)}
    .search::placeholder{color:#9a968e}
    .search:focus{border-color:var(--indigo-deep);box-shadow:none}
    .filter-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
    .filter-btn{white-space:nowrap;border:1px solid var(--line);background:rgba(255,254,250,.7);color:#6b6861;padding:6px 10px;border-radius:2px;font-size:.72rem;cursor:pointer}
    .filter-btn.active{background:var(--moss);border-color:var(--moss);color:#fff;font-weight:650}

    .summary-box{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:15px}
    .mini-stat{background:rgba(255,254,250,.88);border:0;border-radius:0;padding:11px 8px;text-align:center}
    .mini-stat b{display:block;font-family:Georgia,"Times New Roman",serif;font-size:1.18rem;font-weight:500;color:var(--indigo-deep);line-height:1.2}
    .mini-stat span{font-size:.68rem;color:var(--muted);letter-spacing:.035em}

    .card{background:rgba(255,254,250,.94);border-radius:3px;overflow:hidden;margin-bottom:19px;box-shadow:var(--shadow);border:1px solid var(--line);position:relative}
    .card:before{content:"";position:absolute;left:0;top:0;width:3px;height:58px;background:var(--indigo);z-index:2}
    .card.backup{background:#fffdf7}
    .card.backup:before{background:var(--gold)}
    .card.caution:before{background:var(--danger)}
    .photo-wrap{height:205px;background:linear-gradient(145deg,#ece9e1,#dce3e2);position:relative;overflow:hidden}
    .photo{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.86) contrast(.97)}
    .photo-wrap:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 65%,rgba(31,31,28,.20));pointer-events:none}
    .photo-fallback{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;color:#575a55;background:linear-gradient(145deg,#eeeae2,#dfe5e2)}
    .photo-fallback .emoji{font-size:1.65rem;margin-bottom:8px;filter:grayscale(.7)}
    .photo-fallback b{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-weight:600}
    .photo-fallback small{color:#86837c;max-width:420px;margin-top:5px}
    .photo-badge{position:absolute;right:9px;bottom:9px;z-index:1;background:rgba(37,38,35,.74);color:#fff;border-radius:1px;padding:4px 7px;font-size:.62rem;letter-spacing:.04em;backdrop-filter:blur(4px)}
    .credit{position:absolute;left:9px;bottom:9px;z-index:1;background:rgba(248,246,239,.86);color:#68645d;border-radius:1px;padding:3px 6px;font-size:.57rem;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none}

    .body{padding:16px 16px 17px}
    .time-row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:transparent;border-bottom:1px solid var(--line-soft);border-radius:0;padding:0 0 9px;margin-bottom:11px}
    .day-pill{background:transparent;color:var(--indigo-deep);padding:0;border-radius:0;font-family:Georgia,"Times New Roman",serif;font-size:.78rem;font-weight:600;letter-spacing:.07em}
    .time{font-family:Georgia,"Times New Roman",serif;font-weight:600;color:var(--vermillion);font-size:.93rem;letter-spacing:.04em}
    .drive{display:flex;gap:7px;align-items:flex-start;background:#edf1f0;border:0;border-left:2px solid #8b9d9a;color:#536460;border-radius:0;padding:7px 9px;font-size:.76rem;font-weight:600;margin-bottom:11px}
    .title{font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif TC",serif;font-size:1.18rem;font-weight:600;letter-spacing:.025em;color:#272825;margin-bottom:6px;line-height:1.5}
    .meta{font-size:.73rem;color:#817e76;margin-bottom:10px;line-height:1.7}
    .desc{font-size:.86rem;color:#514f4a;line-height:1.75;margin-bottom:12px}
    .badges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:11px}
    .badge{border-radius:1px;padding:3px 7px;font-size:.65rem;font-weight:650;border:1px solid var(--line);background:#f7f4ed;color:#6c6962}
    .badge.ok{background:#edf1e9;color:#55614e;border-color:#cbd4c4}
    .badge.warn{background:#f5efe4;color:#7b633e;border-color:#ded0b8}
    .badge.danger{background:#f4eae7;color:#81534c;border-color:#d8beb7}
    .badge.area{background:#edf0f2;color:#53606d;border-color:#cbd1d5}
    .badge.tag{background:#faf8f2;color:#77736b;border-color:#e3ddd2}

    .diet-box{background:#f4f1e8;border:0;border-left:2px solid var(--moss);border-radius:0;padding:10px 11px;margin-bottom:11px;color:#5a584f;font-size:.77rem}
    .diet-box strong{color:#4c5547;font-weight:700}
    .fact-box{background:#f8f6f0;border:1px solid var(--line-soft);border-radius:1px;padding:9px 10px;margin-bottom:11px;font-size:.74rem;color:#716d65}
    .fact-box b{color:#4f4c46}

    .ig-box{background:#f8f4ee;border:1px solid #ddd3c6;border-radius:2px;padding:10px 11px;margin:10px 0 12px}
    .ig-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;font-size:.75rem;font-weight:700;color:#615a52}
    .ig-note{font-size:.6rem;color:#999086;font-weight:500}
    .ig-links{display:flex;gap:6px;flex-wrap:wrap}
    .ig-link{display:inline-flex;align-items:center;gap:4px;text-decoration:none;background:#fffefa;color:#6a5d55;border:1px solid #d7ccc0;border-radius:1px;padding:6px 8px;font-size:.69rem;font-weight:650;line-height:1.2}
    .ig-link:hover{border-color:var(--vermillion);color:var(--vermillion)}

    .actions{display:grid;grid-template-columns:1.25fr .9fr .8fr;gap:6px;border-top:1px solid var(--line-soft);padding-top:12px}
    .btn{display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;border-radius:2px;padding:9px 7px;font-size:.72rem;font-weight:650;border:1px solid var(--line);background:transparent;color:#595751;cursor:pointer;min-height:39px;letter-spacing:.01em}
    .btn.map{background:var(--indigo-deep);color:#fff;border-color:var(--indigo-deep)}
    .btn.photo-link{background:transparent;color:var(--moss);border-color:#aab4a4}
    .btn.source{background:transparent;color:#6a665f}
    .btn:hover{filter:brightness(.98)}
    .btn:disabled{opacity:.45;cursor:not-allowed}

    .empty{text-align:center;padding:42px 15px;color:#8a867e;background:rgba(255,254,250,.72);border:1px solid var(--line);border-radius:2px}
    footer{padding:14px 7px 26px;color:#918c82;font-size:.67rem;text-align:left;line-height:1.75;border-top:1px solid var(--line);margin-top:24px}
    footer a{color:#767169}

    @media(max-width:520px){
      body{padding:18px 12px 28px}
      header{padding-top:9px}
      h1{font-size:1.47rem}
      .subtitle{font-size:.77rem;line-height:1.65}
      .route-head{align-items:flex-start}
      .route-title{font-size:.88rem;line-height:1.55}
      .svg-wrap{height:350px}
      #car{font-size:42px}
      .photo-wrap{height:184px}
      .body{padding:14px}
      .actions{grid-template-columns:1fr 1fr}
      .actions .btn.source{grid-column:1/-1}
      .ig-head{align-items:flex-start;flex-direction:column;gap:2px}
      .ig-link{font-size:.68rem}
    }

  </style>
</head>

function igHtml(item){
  const links=igGuides[item.query]||[];
  if(!links.length)return '';
  const isRestaurant=restaurantIgQueries.has(item.query);
  const title=isRestaurant?'IG 餐飲參考':'IG 行程參考';
  const note='Instagram 公開內容・可能需登入';
  return `<div class="ig-box"><div class="ig-head"><span>${title}</span><span class="ig-note">${note}</span></div><div class="ig-links">${links.map((x,i)=>`<a class="ig-link" href="${x.url}" rel="noopener">${escapeHtml(x.label)}</a>`).join('')}</div></div>`;
}

let selectedDay=1, currentMode='main', subFilter='全部';
const container=document.getElementById('container');

function renderDayBar(){
  const bar=document.getElementById('dayBar');
  bar.innerHTML=days.map(([d,label])=>`<button class="day-btn ${selectedDay===d?'active':''}" onclick="selectDay(${d},this)">D${d} ${label}</button>`).join('')+
    `<button class="day-btn ${selectedDay==='all'?'active':''}" onclick="selectDay('all',this)">全部</button>`;
}
function renderFilters(){
  document.getElementById('filterRow').innerHTML=filters.map(f=>`<button class="filter-btn ${subFilter===f?'active':''}" onclick="setFilter('${f}',this)">${f}</button>`).join('');
}
function switchMode(mode){
  currentMode=mode;
  document.getElementById('modeMain').className='mode-btn '+(mode==='main'?'active':'');
  document.getElementById('modeLate').className='mode-btn '+(mode==='late'?'late-active':'');
  renderRoute(); playCar(); filterData();
}
function selectDay(day,btn){
  selectedDay=day;
  document.querySelectorAll('.day-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderRoute(); playCar(); filterData();
}
function setFilter(f,btn){
  subFilter=f;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');filterData();
}
function renderRoute(){
  const r=(currentMode==='late' && lateRouteOverrides[selectedDay]) ? lateRouteOverrides[selectedDay] : (routePaths[selectedDay]||routePaths.all);
  document.getElementById('routeTitle').textContent=r.title;
  document.getElementById('basePath').setAttribute('d',r.d);
  const active=document.getElementById('activePath');active.setAttribute('d',r.d);active.style.strokeDasharray='0';active.style.strokeDashoffset='0';
  const g=document.getElementById('stops');g.innerHTML='';
  r.stops.forEach(([x,y,n,a])=>{
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r','7');c.setAttribute('class','stop');g.appendChild(c);
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',a==='r'?Number(x)+8:Number(x)-8);t.setAttribute('y',Number(y)+4);t.setAttribute('text-anchor',a==='r'?'start':'end');t.setAttribute('class','stop-label');t.textContent=n;g.appendChild(t);
  });
}
function playCar(){
  const path=document.getElementById('basePath');
  const active=document.getElementById('activePath');
  const car=document.getElementById('car');
  const wrap=document.getElementById('svgWrap');
  const svg=document.getElementById('routeSvg');
  const len=path.getTotalLength();

  active.style.transition='none';
  active.style.strokeDasharray=len;
  active.style.strokeDashoffset=len;
  requestAnimationFrame(()=>{
    active.style.transition='stroke-dashoffset 2.5s ease';
    active.style.strokeDashoffset='0';
  });

  let start=null;
  const duration=2500;
  function frame(ts){
    if(!start) start=ts;
    const progress=Math.min((ts-start)/duration,1);
    const point=path.getPointAtLength(progress*len);
    const matrix=svg.getScreenCTM();
    const wrapRect=wrap.getBoundingClientRect();

    if(matrix){
      const svgPoint=svg.createSVGPoint();
      svgPoint.x=point.x;
      svgPoint.y=point.y;
      const screenPoint=svgPoint.matrixTransform(matrix);
      car.style.left=`${screenPoint.x-wrapRect.left}px`;
      car.style.top=`${screenPoint.y-wrapRect.top}px`;
    }

    if(progress<1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
function badgeStatus(item){ return ''; }
function dietBadge(item){
  if(item.dietLevel==='safe')return '<span class="badge ok">純素／蛋奶素友善</span>';
  if(item.dietLevel==='medium')return '<span class="badge warn">可調整為蛋奶素</span>';
  if(item.dietLevel==='caution')return '<span class="badge danger">需確認高湯／醬汁</span>';
  return '';
}
function photoHtml(item){
  if(item.photo){
    return `<div class="photo-wrap"><img class="photo" src="${item.photo}" alt="${escapeHtml(item.name)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <div class="photo-fallback" style="display:none"><div class="emoji">•</div><b>${escapeHtml(item.name)}</b><small>圖片暫時無法載入，可使用下方「地圖照片」查看。</small></div>
      <span class="photo-badge">PHOTO</span>${item.photoCredit?`<a class="credit" href="${item.photoSource||'#'}" target="_blank" rel="noopener">${escapeHtml(item.photoCredit)}</a>`:''}</div>`;
  }
  return `<div class="photo-wrap"><div class="photo-fallback"><div class="emoji">•</div><b>${escapeHtml(item.name)}</b><small>可使用下方「地圖照片」查看景點或店家最新影像。</small></div><span class="photo-badge">PLACE</span></div>`;
}
function escapeHtml(s=''){return String(s).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));}
function cardHtml(item){
  const displayTime=currentMode==='late'?(item.lateTime||item.time):item.time;
  const mapcode=item.mapcode?escapeHtml(item.mapcode):'—';
  const tags=item.tags.map(t=>`<span class="badge tag">#${escapeHtml(t)}</span>`).join('');
  const sourceBtn=item.source?`<a class="btn source" href="${item.source}" target="_blank" rel="noopener">官方／網站資訊</a>`:`<a class="btn source" href="${mapsUrl(item.query)}" target="_blank" rel="noopener">地點資訊</a>`;
  const copyLabel=item.mapcode?'複製 MapCode':'複製地址';
  const copyValue=item.mapcode||item.address;
  return `<article class="card ${item.statusLevel==='warn'?'caution':''}">
    ${photoHtml(item)}
    <div class="body">
      <div class="time-row"><span class="day-pill">D${item.day}・${item.date}</span><span class="time">⏰ ${escapeHtml(displayTime)}</span></div>
      <div class="drive"><span>DRIVE</span><span>${escapeHtml(item.drive)}</span></div>
      <div class="title">${escapeHtml(item.name)}</div>
      <div class="meta">${escapeHtml(item.area)} ｜ ${escapeHtml(item.address)}<br>MapCode：<b>${mapcode}</b></div>
      <div class="desc">${escapeHtml(item.desc)}</div>
      <div class="badges"><span class="badge area">${escapeHtml(item.area)}</span>${dietBadge(item)}${tags}</div>
      ${item.diet&&item.diet!=='—'?`<div class="diet-box"><strong>蛋奶素建議　</strong>${escapeHtml(item.diet)}</div>`:''}
      ${item.mapcode?`<div class="fact-box"><b>導航：</b>Google Maps 建議直接導航至店名或設施入口；車機可使用 MapCode，停車場入口可能另有位置設定。</div>`:''}
      ${igHtml(item)}
      <div class="actions">
        <a class="btn map" href="${mapsNavUrl(item.query)}" onclick="goGoogleMaps(${JSON.stringify(item.query)}); return false;">Google 導航</a>
        <a class="btn photo-link" href="${mapsUrl(item.query)}">地圖照片</a>
        <button class="btn" onclick='copyText(${JSON.stringify(copyValue)})'>${copyLabel}</button>
        ${sourceBtn}
      </div>
    </div>
  </article>`;
}
function filterData(){
  const k=document.getElementById('search').value.trim().toLowerCase();
  const arr=data.filter(item=>{
    if(currentMode==='late'&&!item.late)return false;
    if(selectedDay!=='all'&&item.day!==selectedDay)return false;
    if(subFilter==='北部'||subFilter==='中部'||subFilter==='南部'||subFilter==='那霸市區'){if(item.area!==subFilter)return false;}
    if(subFilter==='蛋奶素選項'&&!['safe','medium'].includes(item.dietLevel))return false;
    if(subFilter==='IG 參考'&&!(igGuides[item.query]||[]).length)return false;
    if(subFilter==='附照片'&&!item.photo)return false;
    const hay=[item.name,item.area,item.address,item.mapcode,item.desc,item.diet,item.status,...item.tags].join(' ').toLowerCase();
    return !k||hay.includes(k);
  });
  container.innerHTML=arr.length?arr.map(cardHtml).join(''):'<div class="empty">找不到符合條件的地點。可改成「全部」或換關鍵字。</div>';
  document.getElementById('countPlaces').textContent=arr.length;
  document.getElementById('countVeg').textContent=arr.filter(x=>['safe','medium'].includes(x.dietLevel)).length;
  document.getElementById('countPhoto').textContent=arr.filter(x=>x.photo).length;
}
function copyText(text){
  navigator.clipboard?.writeText(text).then(()=>alert(`已複製：${text}`)).catch(()=>prompt('請手動複製：',text));
}
